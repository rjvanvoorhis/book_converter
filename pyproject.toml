[project]
name = "book-converter"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.6"
dependencies = [
    "beautifulsoup4>=4.12.3",
    "ebooklib>=0.20",
    "fastapi>=0.68.1",
    "language-tool-python>=2.8.2",
    "lxml>=5.4.0",
    "python-multipart>=0.0.5",
    "requests>=2.27.1",
    "typer>=0.10.0",
    "uvicorn>=0.16.0",
]

[project.scripts]
book-converter = "book_converter:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = []
