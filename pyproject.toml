[project]
name = "book-converter"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "curl-cffi>=0.16.3",
    "ebooklib>=0.20",
    "fastapi>=0.68.1",
    "language-tool-python>=2.8.2",
    "lxml>=5.4.0",
    "matplotlib>=3.3.4",
    "mobi>=0.3.2",
    "numpy>=1.19.5",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.5",
    "requests>=2.27.1",
    "smbprotocol>=1.17.0",
    "typer>=0.10.0",
    "uvicorn>=0.16.0",
]

[project.scripts]
book-converter = "book_converter:main"
book-converter-api = "book_converter.entrypoints.api:main"
book-converter-ui = "book_converter.entrypoints.ui:main"
book-converter-setup-audio-clean = "book_converter.entrypoints.setup_audio_clean_worker:main"
book-converter-setup-mount-user = "book_converter.entrypoints.setup_audiobookshelf_mount_user:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.16.0",
]

[tool.ruff]
line-length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]
