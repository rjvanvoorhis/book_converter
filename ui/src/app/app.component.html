<div class="shell">
  <header class="app-header">
    <div class="brand">
      <span class="brand-mark">B</span>
      <span class="brand-name">{{ title }}</span>
    </div>
  </header>

  <div class="body">
    <nav class="sidebar">
      <a class="nav-item" routerLink="/extract-text" routerLinkActive="active">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
          <path
            d="M6 3h9l4 4v14a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
          <path d="M14 3v5h5M9 17v-5l2 2 2-2v5" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        <span>Extract</span>
      </a>
      <a
        class="nav-item"
        routerLink="/create-audiobook"
        routerLinkActive="active"
      >
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
          <circle cx="12" cy="12" r="9" />
          <path d="M12 8v8M8 12h8" stroke-linecap="round" />
        </svg>
        <span>Create</span>
      </a>
      <a class="nav-item" routerLink="/audit" routerLinkActive="active">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
          <path
            d="M3 12h3l2.5-7 4 14 2.5-9 2 2H21"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
        <span>Audit</span>
      </a>
      <a class="nav-item" routerLink="/organization" routerLinkActive="active">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
          <rect x="3" y="4" width="7" height="7" rx="1" />
          <rect x="14" y="4" width="7" height="7" rx="1" />
          <rect x="8.5" y="15" width="7" height="6" rx="1" />
          <path d="M6.5 11v2a2 2 0 0 0 2 2h1M17.5 11v2a2 2 0 0 1-2 2h-1" stroke-linecap="round" />
        </svg>
        <span>Organize</span>
      </a>
      <a class="nav-item" routerLink="/pronunciations" routerLinkActive="active">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
          <path
            d="M4 5h16v10H9l-4 4V15H4z"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
          <path d="M8 9h8M8 12h5" stroke-linecap="round" />
        </svg>
        <span>Words</span>
      </a>
      <a class="nav-item" routerLink="/voice-samples" routerLinkActive="active">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
          <path
            d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3z"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
          <path d="M6 11a6 6 0 0 0 12 0M12 17v3" stroke-linecap="round" />
        </svg>
        <span>Voices</span>
      </a>
    </nav>

    <main class="content">
      <router-outlet />
    </main>
  </div>
</div>
